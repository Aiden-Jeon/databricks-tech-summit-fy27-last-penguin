# Databricks Asset Bundle — Workshop: Nimbus (Conversion Slide & Feature Velocity).
#
# WORKSHOP TEMPLATE — this bundle does the MINIMUM so a trainee can start the
# AI Customer Challenge: it stands up the schema + a raw-data Volume and a job
# that generates the synthetic dataset. It deliberately does NOT build the
# pipeline, metric view, model, dashboard, Lakebase, or the app — those are the
# graded milestones the trainee builds (see README.md → "What YOU need to
# create" and app/APP_WORKSHOP.md).
#
#   1. `databricks bundle deploy`            → schema + raw_data volume + setup job
#   2. `databricks bundle run nimbus_setup`  → generates the synthetic raw data
#   Then follow README.md: build Milestone 1 (Data) → 2 (Lakebase) → 3 (App) → 4 (AI Gateway).
#
# The README + specifications/ + data_generation/ + app/ come with the forked
# template folder; this bundle only provisions the workspace resources needed to
# get data flowing. Deploy is documented in README.md — do NOT run it as part of authoring.
bundle:
  name: databricks-tech-summit-fy27-last-penguin

workspace:
  host: https://fe-sandbox-last-penguin.cloud.databricks.com
  profile: fe-sandbox-last-penguin
  # The default location is user-scoped. The prod target overrides this with
  # the shared workshop paths below.
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# Treat the repository as the source of truth for the deployed project files.
# Databricks' default bundle exclusions still omit .git, local build output,
# node_modules, and other ignored files.
sync:
  include:
    - README.md
    - resources.json
    - data_generation/**
    - docs/**
    - specifications/**
    - transformation/**
    - app/**
  exclude:
    - app/node_modules/**

artifacts:
  app:
    path: ./app
    build: npm run build:source

variables:
  catalog:
    description: Unity Catalog for the workshop data (must already exist / you can create it).
    default: last_penguin_catalog
  schema:
    description: Schema for the demo tables + the raw_data volume (created by this bundle).
    default: nimbus

resources:
  apps:
    nimbus_app:
      name: nimbus-growth-desk
      description: "Nimbus Growth Desk — conversion slide and feature velocity demo."
      source_code_path: ./app
      lifecycle:
        started: true

  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Workshop — Nimbus conversion-slide/feature-velocity: synthetic cohort + event data."

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.demo_schema.name}
      name: raw_data
      volume_type: MANAGED
      comment: "Raw parquet landing zone — generate_data.py writes here; the SDP silver you build reads it via read_files()."

  jobs:
    nimbus_setup:
      name: "[Workshop] Nimbus — generate data"
      description: "Generates the synthetic raw_* parquet datasets into the raw_data volume. Run this once after deploy, then build the pipeline/Lakebase/app/gateway yourself."
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./data_generation/generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.demo_schema.name}
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
              - faker

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: ${workspace.current_user.short_name}_nimbus
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
      file_path: /Workspace/Shared/nimbus
