name: Databricks CI/CD

on:
  pull_request:
    paths:
      - databricks.yml
      - data_generation/**
      - .github/workflows/databricks-cicd.yml
  push:
    branches: [main]
    paths:
      - databricks.yml
      - data_generation/**
      - .github/workflows/databricks-cicd.yml
  workflow_dispatch:
    inputs:
      target:
        description: Databricks bundle target
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

concurrency:
  group: databricks-${{ github.workflow }}-${{ github.event.inputs.target || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate development target
        run: databricks bundle validate --target dev
      - name: Validate production target
        run: databricks bundle validate --target prod

  deploy:
    name: Deploy ${{ github.event.inputs.target || 'prod' }}
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'prod' }}
    env:
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle
        run: databricks bundle deploy --target "$DEPLOY_TARGET" --auto-approve
